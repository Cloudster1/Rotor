[project]
name = "rotor-runner"
version = "0.1.0"
description = "Runs a Rotor workflow as a LangGraph graph inside its sandbox."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langchain-mcp-adapters==0.3.2",
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "ruamel.yaml==0.19.1",
    "jsonschema==4.26.0",
    "langchain==1.4.3",
    "langchain-anthropic==1.7.5",
    "langchain-openai==1.6.7",
    "httpx==0.28.1",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "types-grpcio==1.84.0.20260928",
    "grpcio-tools==1.84.0",
    "mypy-protobuf==5.1.0",
    "types-jsonschema==4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
# Generated from proto/ by make proto; a freshness check keeps it current.
extend-exclude = ["src/rotor_runner/pb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["src/rotor_runner/pb/.*_pb2(_grpc)?\\.py$"]

[[tool.mypy.overrides]]
module = ["rotor_runner.pb.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["stack: needs the compose stack's test double; run by make test-runner"]

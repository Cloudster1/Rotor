id: rotor-trial-tool
display_name: Rotor trial tool
description: The echo service of the trial of Rotor issue 118.
category: other
credentials:
  - name: token
    env_vars: [TRIAL_TOKEN]
    required: true
    auth_style: bearer
    header_name: Authorization
endpoints:
  - host: echo.openshell-sandboxes.svc.cluster.local
    port: 8080
    protocol: rest
    access: read-write
    enforcement: enforce
    allowed_ips: [10.96.0.0/16]
binaries:
  - /opt/python/cpython-3.13.12-linux-x86_64-gnu/bin/python3.13

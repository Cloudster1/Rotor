# What the chart install test (#29, #27) adds to values-trial.yaml: the dev OpenBao beside the release, configured by
# the chart's own Job, sandboxes under runc (all kind has), and egress through Cilium to one public host.
openbao:
  addr: http://openbao.rotor-chart.svc:8200
  configure:
    enabled: true
    tokenSecret: { name: openbao-admin, key: token }
    # The test's OpenBao runs in dev mode with no configuration file, so it can declare no audit device.
    requireAudit: false
sandbox:
  runtimeClass: ""
  allowRunc: true
  egress:
    cilium: true
    hosts: [example.com]
    openbao:
      namespace: rotor-chart
      podLabels: { app: openbao }
ingress:
  enabled: false

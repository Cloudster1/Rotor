# The throwaway cluster the Kubernetes tests run in: one node, which runs runc, so the tests set
# ROTOR_SANDBOX_ALLOW_RUNC. Its network plugin is Cilium (make kind-up installs it), so the sandboxes' egress
# policies, hostname allows included, are enforced as in production (#27).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
# Where containerd reads how to reach a registry, so the chart install test can pull signed images from a plain HTTP
# registry beside the cluster (#42).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

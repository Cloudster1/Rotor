      app.kubernetes.io/instance: r
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotor
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-rotor-valkey
                  key: password
          command: ["/bin/sh", "-c"]
          args: ['exec valkey-server --appendonly yes --dir /data --requirepass "$VALKEY_PASSWORD"']
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

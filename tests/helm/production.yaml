# Source: rotor/templates/job-secrets.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: r-rotor-secrets-generator
  labels:
    helm.sh/chart: rotor-0.1.0
    app.kubernetes.io/name: rotor
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: rotor
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotor
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: Never
      serviceAccountName: r-rotor-secrets-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: secrets
          image: alpine/kubectl:1.34.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            # kubectl keeps its discovery cache under HOME.
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns="default"

              # Any lookup failure but NotFound stops the Job: read as absent, it would try to create a Secret that
              # may well exist.
              exists() {
                if out=$(kubectl get secret "$1" -n "$ns" -o name 2>&1); then return 0; fi
                case "$out" in *NotFound*) return 1 ;; esac
                echo "$out" >&2
                exit 1
              }

              password() {
                tr -dc A-Za-z0-9 </dev/urandom | head -c 32
              }

              # Labelled as Rotor's without being Helm's, so an uninstall keeps the passwords the data was made with.
              create() {
                kubectl create secret generic "$1" -n "$ns" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$2" \
                  --from-literal=password="$3" \
                  --dry-run=client -o yaml \
                | kubectl label --local -f - -o yaml \
                    app.kubernetes.io/part-of=rotor \
                    app.kubernetes.io/instance="r" \
                | kubectl create -f - 2>err || {
                  grep -q AlreadyExists err && return 0
                  cat err >&2
                  exit 1
                }
                echo "created $1 with a random password"
              }
              cd /tmp
              if exists "r-rotor-db-app"; then
                echo "r-rotor-db-app exists and is left as it is"
              else
                create "r-rotor-db-app" "rotor_app" "$(password)"
              fi
              if exists "r-rotor-db-admin"; then
                echo "r-rotor-db-admin exists and is left as it is"
              else
                create "r-rotor-db-admin" "rotor_admin" "$(password)"
              fi
              if exists "r-rotor-db-owner"; then
                echo "r-rotor-db-owner exists and is left as it is"
              else
                echo "Secret r-rotor-db-owner does not exist. The chart cannot make this password up, because the server it belongs to already has one: create it as a kubernetes.io/basic-auth Secret with that password, or name one that exists in secrets.names.dbOwner." >&2
                exit 1
              fi
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# Source: rotor/templates/job-roles.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: r-rotor-roles
  labels:
    helm.sh/chart: rotor-0.1.0
    app.kubernetes.io/name: rotor
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: rotor
    app.kubernetes.io/component: roles
  annotations:
    # post-install, not pre-install: pre-install hooks run before the release's own resources exist, a bundled
    # database included.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotor
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: r-rotor-jobs
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-rotor-db-owner
                  key: password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-rotor-db-app
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-rotor-db-admin
                  key: password
            # A host that drops packets would otherwise hold a connect open until the Job's deadline.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGURL
              value: "postgres://postgres:$(DB_OWNER_PASSWORD)@db.example:5432/rotor?sslmode=require"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until psql "$PGURL" -Atc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for the database to accept the owner role"
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              -- A named tag, not $$: Kubernetes reads $$ in args as an escaped $.
              DO $roles$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rotor_app') THEN
                      CREATE ROLE rotor_app LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rotor_admin') THEN
                      CREATE ROLE rotor_admin LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
              END;
              $roles$;
              SQL
              # Outside the DO block: the passwords change between installs, and ALTER is the idempotent way to say so.
              psql -v ON_ERROR_STOP=1 "$PGURL" \
                -c "ALTER ROLE rotor_app WITH LOGIN PASSWORD '$APP_PASSWORD'" \
                -c "ALTER ROLE rotor_admin WITH LOGIN PASSWORD '$ADMIN_PASSWORD'" \
                -c "GRANT CONNECT ON DATABASE rotor TO rotor_app, rotor_admin"
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }

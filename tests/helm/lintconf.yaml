# yamllint's rules for ct lint, in the repository's own YAML style: flow maps with inner spaces, lines up to 120.
extends: default
rules:
  braces: { min-spaces-inside: 0, max-spaces-inside: 1 }
  brackets: { min-spaces-inside: 0, max-spaces-inside: 1 }
  line-length: { max: 120 }
  document-start: disable
  truthy: { check-keys: false }
  comments: { min-spaces-from-content: 1 }

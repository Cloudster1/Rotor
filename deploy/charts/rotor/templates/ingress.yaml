{{- if .Values.ingress.enabled }}
{{/* Everything goes to the web, whose nginx proxies /api to the api on the same origin, as in development. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rotor.fullname" . }}
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rotor.fullname" . }}-web
                port:
                  name: http
{{- end }}
{{- with .Values.ingress.otlpGrpc }}
{{- if .enabled }}
---
{{/* OTLP over gRPC goes straight to the api over HTTP/2 (#262); the web's nginx speaks HTTP/1.1 to it. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rotor.fullname" $ }}-otlp-grpc
  labels:
    {{- include "rotor.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tls.enabled }}
  tls:
    - hosts: [{{ .host | quote }}]
      secretName: {{ .tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rotor.fullname" $ }}-api
                port:
                  name: otlp-grpc
{{- end }}
{{- end }}

{{/*
The api and the worker sign in to OpenBao with their own ServiceAccount tokens, so theirs are mounted. The Jobs need
none, and neither does the web.
*/}}
{{- range $who := list "api" "worker" "jobs" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rotor.fullname" $ }}-{{ $who }}
  labels:
    {{- include "rotor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $who }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ ne $who "jobs" }}
---
{{- end }}

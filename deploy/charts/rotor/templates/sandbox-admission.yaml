{{- if .Values.sandbox.admission.requireSignature }}
{{/*
Admission in the sandbox namespace (#42, #44): sigstore's policy-controller admits a pod there only when its image
carries a trusted signature and a signed SBOM, by the operator's key or else keyless by Rotor's release workflow. An
image from another repository matches no policy, which it refuses too. Two policies, since an image must pass every
policy that matches it, while one passing authority satisfies a policy.
*/}}
{{- $a := .Values.sandbox.admission }}
{{- $keyless := $a.keyless | default dict }}
{{- if and (not $a.publicKey) (not (and $keyless.issuer $keyless.subjectRegExp)) }}
{{- fail "sandbox.admission.requireSignature is on, so set sandbox.admission.publicKey to the cosign public key the runner image is signed with, or keep sandbox.admission.keyless.issuer and subjectRegExp for Rotor's released images." }}
{{- end }}
{{- $repos := list .Values.images.runner.repository .Values.images.agent.repository }}
{{- range $check := list "signed" "sbom" }}
---
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: {{ include "rotor.fullname" $ }}-sandboxes-{{ $check }}
  labels:
    {{- include "rotor.labels" $ | nindent 4 }}
spec:
  images:
    {{- range $repo := $repos }}
    - glob: {{ printf "%s@*" $repo | quote }}
    - glob: {{ printf "%s:*" $repo | quote }}
    {{- end }}
  authorities:
    {{- if $a.publicKey }}
    - name: runner-key
      key:
        hashAlgorithm: sha256
        data: |
          {{- $a.publicKey | trim | nindent 10 }}
    {{- else }}
    - name: rotor-release
      keyless:
        identities:
          - issuer: {{ $keyless.issuer | quote }}
            subjectRegExp: {{ $keyless.subjectRegExp | quote }}
    {{- end }}
      {{- if eq $check "sbom" }}
      attestations:
        - name: sbom
          predicateType: spdxjson
      {{- end }}
{{- end }}
{{- with .Values.sandbox.workspaces.toolchainImages }}
---
# The toolchain images administrators allow workspaces (#136) are no image of Rotor's; they run as they are.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: {{ include "rotor.fullname" $ }}-sandbox-toolchains
  labels:
    {{- include "rotor.labels" $ | nindent 4 }}
spec:
  images:
    {{- range . }}
    - glob: {{ . | quote }}
    {{- end }}
  authorities:
    - name: allowed-toolchain
      static:
        action: pass
{{- end }}
{{- end }}

{{- if .Values.secrets.generate }}
{{/*
Random passwords, made once, inside the cluster, as Exciter's chart makes them: a template that rendered them would
invent new ones on every Argo CD sync. Runs before everything else, so the database and the workloads find them.
*/}}
{{- $name := printf "%s-secrets-generator" (include "rotor.fullname" .) }}
{{- $secrets := list
  (dict "name" (include "rotor.credentialSecret" (dict "root" . "name" "dbApp")) "user" "rotor_app" "generate" true "value" "secrets.names.dbApp")
  (dict "name" (include "rotor.credentialSecret" (dict "root" . "name" "dbAdmin")) "user" "rotor_admin" "generate" true "value" "secrets.names.dbAdmin")
  (dict "name" (include "rotor.credentialSecret" (dict "root" . "name" "dbOwner")) "user" .Values.database.ownerRole "generate" .Values.postgresql.enabled "value" "secrets.names.dbOwner")
}}
{{- if include "rotor.valkeyAuth" . }}
{{- $secrets = append $secrets (dict "name" (include "rotor.credentialSecret" (dict "root" . "name" "valkey")) "user" "default" "generate" .Values.valkey.bundled "value" "secrets.names.valkey") }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
  annotations:
    {{- include "rotor.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-40") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
  annotations:
    {{- include "rotor.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-39") | nindent 4 }}
rules:
  # Kubernetes cannot scope create to resource names, so reading is limited to these Secrets and creating is not.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $secrets }}
      - {{ .name }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
  annotations:
    {{- include "rotor.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-38") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    {{- include "rotor.hookAnnotations" (dict "helm" "pre-install,pre-upgrade" "argo" "PreSync" "weight" "-30") | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "rotor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: secrets
          image: {{ include "rotor.image" (dict "root" $ "name" "kubectl") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # kubectl keeps its discovery cache under HOME.
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns={{ .Release.Namespace | quote }}

              # Any lookup failure but NotFound stops the Job: read as absent, it would try to create a Secret that
              # may well exist.
              exists() {
                if out=$(kubectl get secret "$1" -n "$ns" -o name 2>&1); then return 0; fi
                case "$out" in *NotFound*) return 1 ;; esac
                echo "$out" >&2
                exit 1
              }

              password() {
                tr -dc A-Za-z0-9 </dev/urandom | head -c {{ int .Values.secrets.passwordLength }}
              }

              # Labelled as Rotor's without being Helm's, so an uninstall keeps the passwords the data was made with.
              create() {
                kubectl create secret generic "$1" -n "$ns" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$2" \
                  --from-literal=password="$3" \
                  --dry-run=client -o yaml \
                | kubectl label --local -f - -o yaml \
                    app.kubernetes.io/part-of=rotor \
                    app.kubernetes.io/instance={{ .Release.Name | quote }} \
                | kubectl create -f - 2>err || {
                  grep -q AlreadyExists err && return 0
                  cat err >&2
                  exit 1
                }
                echo "created $1 with a random password"
              }
              cd /tmp

              {{- range $secrets }}
              if exists {{ .name | quote }}; then
                echo "{{ .name }} exists and is left as it is"
              {{- if .generate }}
              else
                create {{ .name | quote }} {{ .user | quote }} "$(password)"
              {{- else }}
              else
                echo "Secret {{ .name }} does not exist. The chart cannot make this password up, because the server it belongs to already has one: create it as a kubernetes.io/basic-auth Secret with that password, or name one that exists in {{ .value }}." >&2
                exit 1
              {{- end }}
              fi
              {{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

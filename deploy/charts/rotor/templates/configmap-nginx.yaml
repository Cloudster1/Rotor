{{/*
deploy/nginx.conf proxies to the compose service name api, which resolves nowhere else. This is that file with the
api's Service name, listening above 1024 for nginx's own user.
*/}}
{{- $csp := "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" }}
{{- $api := printf "%s-api:%d" (include "rotor.fullname" .) (int .Values.api.port) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rotor.fullname" . }}-nginx
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream rotor_api {
        server {{ $api }};
        keepalive 32;
    }

    server {
        listen {{ .Values.web.port }};
        server_name _;
        root /usr/share/nginx/html;

        location /api/ {
            client_max_body_size 0;
            # Run events stream over SSE, which must reach the browser as they are written.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://rotor_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The OAuth metadata sits where RFC 8414 and RFC 9728 put it, at the root, and the api answers it (#47).
        location ^~ /.well-known/oauth- {
            proxy_pass http://rotor_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            proxy_pass http://rotor_api;
        }
        location = /readyz {
            proxy_pass http://rotor_api;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }

{{- if .Values.openbao.configure.enabled }}
{{- $after := .Values.openbao.configure.afterInstall }}
{{- $hook := dict "helm" (ternary "post-install,pre-upgrade" "pre-install,pre-upgrade" $after) "argo" (ternary "Sync" "PreSync" $after) }}
{{/*
Runs Rotor's OpenBao init script (files/openbao, a copy of deploy/openbao that tests/test-helm.sh keeps equal) against
the installation's OpenBao: the KV mount, the transit key, the runner PKI for the api's Service name, the policy and
the Kubernetes auth role the api and the worker sign in with. Safe to run again on every upgrade.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rotor.fullname" . }}-openbao
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
  annotations:
    {{- include "rotor.hookAnnotations" (merge (dict "weight" "-21") $hook) | nindent 4 }}
data:
  init.sh: |
    {{- .Files.Get "files/openbao/init.sh" | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/openbao/policies/*.hcl" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rotor.fullname" . }}-openbao
  labels:
    {{- include "rotor.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
  annotations:
    {{- include "rotor.hookAnnotations" (merge (dict "weight" "-20") $hook) | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "rotor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: openbao
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: openbao
          image: {{ include "rotor.image" (dict "root" $ "name" "openbao") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if $after }}
          # An OpenBao the same release installs comes up beside this Job, so it waits until that one answers unsealed.
          command: ["/bin/sh", "-c", "until bao status >/dev/null 2>&1; do echo waiting for OpenBao at $BAO_ADDR; sleep {{ int .Values.openbao.configure.waitSeconds }}; done; exec /bin/sh /rotor/init.sh"]
          {{- else }}
          command: ["/bin/sh", "/rotor/init.sh"]
          {{- end }}
          env:
            - name: HOME
              value: /tmp
            - name: BAO_ADDR
              value: {{ include "rotor.openbaoAddr" . | quote }}
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.openbao.configure.tokenSecret.name }}, key: {{ .Values.openbao.configure.tokenSecret.key }} }
            - name: ROTOR_POLICY_DIR
              value: /rotor
            - name: ROTOR_RUNNER_HOST
              value: {{ include "rotor.runnerHost" . | quote }}
            - name: ROTOR_KUBERNETES_HOST
              value: {{ .Values.openbao.configure.kubernetesHost | quote }}
            - name: ROTOR_CONTROL_PLANE_SERVICE_ACCOUNTS
              value: {{ printf "%s,%s" (include "rotor.apiAccount" .) (include "rotor.workerAccount" .) | quote }}
            - name: ROTOR_CONTROL_PLANE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ROTOR_OPENBAO_REQUIRE_AUDIT
              value: {{ .Values.openbao.configure.requireAudit | quote }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: script
              mountPath: /rotor
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: {{ include "rotor.fullname" . }}-openbao
        - name: tmp
          emptyDir: {}
{{- end }}

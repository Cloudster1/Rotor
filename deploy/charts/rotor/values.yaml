# Rotor. The defaults describe a real deployment: your own Postgres, Valkey, OpenBao and Keycloak, and sandboxes
# under gVisor. For a trial that brings Postgres and Valkey along, install with -f values-trial.yaml as well.
# docs/deployment.md walks through both.

nameOverride: ""
fullnameOverride: ""

images:
  # deploy/Dockerfile.backend carries every Go binary; each workload runs the one it needs. An empty tag means the
  # chart's appVersion; a digest, sha256:..., wins over the tag. Name Rotor's images by digest in production, so the
  # cluster runs exactly the images that were signed (#42); docs/deployment.md says how to check them.
  backend: { repository: ghcr.io/cloudster1/rotor-backend, tag: "", digest: "" }
  web: { repository: ghcr.io/cloudster1/rotor-web, tag: "", digest: "" }
  # The sandboxes' image, which every run executes.
  runner: { repository: ghcr.io/cloudster1/rotor-runner, tag: "", digest: "" }
  # The client the roles Job runs and the server the bundled Postgres runs.
  psql: { repository: postgres, tag: 18-alpine }
  valkey: { repository: valkey/valkey, tag: 8-alpine }
  # The secrets Job needs a shell next to kubectl; the OpenBao Job runs Rotor's init script with bao.
  kubectl: { repository: alpine/kubectl, tag: 1.34.1 }
  openbao: { repository: openbao/openbao, tag: 2.7.1 }
  pullPolicy: IfNotPresent
  pullSecrets: []

# development, staging or production. Anything but development requires secure cookies and Keycloak.
env: production
logLevel: info

ingress:
  enabled: true
  className: ""
  # The host the browser uses. The session cookie and the same-site check are derived from it.
  host: rotor.example.com
  tls:
    enabled: true
    secretName: rotor-tls
  annotations: {}

api:
  replicas: 2
  port: 8080
  # Where sandboxes dial the runner protocol, over TLS with a certificate from OpenBao's PKI.
  runnerPort: 9443
  # The api's /metrics, in Prometheus's format: token mint failures and the process's own (#37).
  metricsPort: 9465
  # CIDRs of the web pods' network, whose X-Real-IP header the api takes as the caller's address; the limit on
  # assistants registering from one address counts by it (#47). Empty takes the peer's address.
  trustedProxies: []
  terminationGracePeriodSeconds: 40
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicas: 1
  # The worker's /metrics, in Prometheus's text format: live and reaped sandboxes and runs by state.
  metricsPort: 9464
  terminationGracePeriodSeconds: 20
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Traces (#37). The api and the worker send their spans and their runners' to otlpEndpoint over OTLP/HTTP, the whole
# URL with /v1/traces, such as http://otel-collector.observability:4318/v1/traces; empty keeps none.
telemetry:
  otlpEndpoint: ""
  # The share of new traces kept; a trace a caller began keeps its own decision.
  sampleRatio: 1
  # Where runs' spans go once an administrator turns LangSmith on in Rotor's settings; the api must reach it.
  langsmithEndpoint: https://api.smith.langchain.com/otel/v1/traces

web:
  replicas: 2
  # Stock nginx as its own user, so it listens above 1024 and the root filesystem stays read only.
  runAsUser: 101
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # Where the workloads connect when the bundled postgresql is off; the chart never guesses it.
  host: ""
  port: 5432
  name: rotor
  sslmode: require
  # The role the roles and migrate Jobs connect as, which owns the schema and may CREATE ROLE. The workloads connect
  # as rotor_app, bound by every row level security policy, and rotor_admin, exempt by policy; those names are the
  # migrations' own.
  ownerRole: postgres

# A trial database: one pod, one volume, no replica and no backup.
postgresql:
  enabled: false
  storage: 8Gi
  storageClass: ""
  dataPath: /var/lib/postgresql/data/pgdata
  runAsUser: 70
  runAsGroup: 70
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

valkey:
  # The pub/sub that tells every api replica about a run's events and cancels, and the tools' catalog cache. A Valkey
  # or Redis you run; ignored when the bundled one is on. Losing it costs latency, never data.
  host: ""
  port: 6379
  db: 0
  # Whether that server wants a password, read from the Secret secrets.names.valkey names, which you create. Outside
  # development the chart refuses a Valkey without one (#92).
  auth: false
  # Connect over TLS (rediss://), trusting the system's certificate authorities.
  tls: false
  # A single pod for a trial, with a generated password.
  bundled: false
  storage: 1Gi
  storageClass: ""
  runAsUser: 999
  runAsGroup: 1000
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 256Mi }

oidc:
  # The realm people sign in through, as the browser reaches it; Rotor's client and the Secret holding its secret.
  issuer: ""
  clientId: rotor
  clientSecret: { name: "", key: client-secret }
  # public=reachable pairs, for an issuer the pods reach at another address than the browser.
  backchannel: {}

openbao:
  # Where every long-lived secret lives. The api and the worker sign in with their own ServiceAccount tokens
  # (Kubernetes auth); sandboxes hold no OpenBao credential, only single-use wrapping tokens.
  addr: ""
  auth: kubernetes
  role: rotor-control-plane
  mount: rotor
  # A hook Job that runs Rotor's init script against that OpenBao: the KV mount, the transit key, the runner PKI,
  # the policy and the Kubernetes auth role. It needs a token allowed to configure OpenBao, from a Secret you make.
  configure:
    enabled: false
    tokenSecret: { name: "", key: token }
    # Where OpenBao reaches this cluster's API server to review the control plane's tokens.
    kubernetesHost: https://kubernetes.default.svc
    # Refuse an OpenBao without an audit device, which it takes from its own configuration only (#92). Turn off
    # only for a throwaway test server.
    requireAudit: true

tools:
  # public=reachable pairs: a tool an administrator adds by the address a browser opens, reached by the pods at another.
  backchannel: {}

sandbox:
  # Where every run's pod runs; empty is <release namespace>-sandboxes. The chart creates it with the restricted Pod
  # Security standard unless told the namespace exists.
  namespace: ""
  createNamespace: true
  # The gVisor RuntimeClass of the cluster. Empty runs sandboxes without gVisor, which only allowRunc permits, and
  # never in production.
  runtimeClass: gvisor
  allowRunc: false
  # The ServiceAccount every sandbox pod runs as; it carries no token.
  serviceAccount: rotor-sandbox
  # Where a sandbox may connect (#27): nothing reaches it, and it reaches cluster DNS, the api's runner port, OpenBao
  # and the tools and the model provider alone; cloud metadata and the rest of the cluster are refused.
  egress:
    enabled: true
    # Hostname allows need Cilium, which matches a name against what the pod resolved; plain NetworkPolicy matches
    # addresses only. Turn this on where Cilium is the cluster's network plugin.
    cilium: false
    # The tools' and the provider's hostnames, such as exciter.example.com or api.anthropic.com; needs cilium.
    hosts: []
    ports: [443]
    # Without Cilium, the address ranges the tools and the provider are reached at instead.
    cidrs: []
    # Where OpenBao is: pods in a namespace of this cluster, or an address range outside it.
    openbao:
      namespace: ""
      podLabels: {}
      cidr: ""
    # Cluster DNS, which a sandbox resolves the tools' names through.
    dns:
      namespace: kube-system
      podLabels: { k8s-app: kube-dns }
  # Refuse a sandbox pod whose image the runner's cosign key did not sign, or that carries no signed SBOM (#42).
  # sigstore's policy-controller enforces it and must be installed first; the chart labels the sandbox namespace for
  # it when it creates the namespace, and one that exists needs the label policy.sigstore.dev/include=true by hand.
  admission:
    requireSignature: false
    # The cosign public key, PEM, for a runner image you signed yourself; set, it is the only signature trusted.
    publicKey: ""
    # Without a key, the identity Rotor's release workflow signs with (#44): a certificate from sigstore's public
    # Fulcio for that workflow at a v* tag, recorded in the public transparency log.
    keyless:
      issuer: https://token.actions.githubusercontent.com
      subjectRegExp: ^https://github.com/Cloudster1/Rotor/.github/workflows/release.yml@refs/tags/v

secrets:
  # Generates the database and Valkey passwords once, inside the cluster, before anything else starts.
  generate: true
  passwordLength: 32
  # Existing Secrets to use instead, each kubernetes.io/basic-auth with a password key: dbOwner, dbApp, dbAdmin,
  # valkey.
  names: {}

jobs:
  roles: { enabled: true }
  migrate: { enabled: true }

serviceAccount:
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }

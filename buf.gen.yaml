# Go code for the control plane, from plugins installed in the Go container; Python is generated by grpcio-tools.
version: v2
plugins:
  - local: protoc-gen-go
    out: backend
    opt: module=github.com/cloudster1/rotor/backend
  - local: protoc-gen-go-grpc
    out: backend
    opt: module=github.com/cloudster1/rotor/backend

# The tests against the real Exciter (#8) and Armature (#130): nightly, by hand, and on a pull request labelled
# suite. Building them adds minutes, so this is no required check; the gate in ci.yml tests against the tool-stub
# instead. Besides the pinned commits, the nightly tests the siblings' main, so a change that would break Rotor shows
# before it is tagged (#43); a pull request tests the pinned ones only.
name: Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-suite:
    name: test-suite
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'suite')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        against: ${{ fromJSON(github.event_name == 'pull_request' && '["pinned"]' || '["pinned", "main"]') }}
    env:
      # Only the main leg overrides the pinned commit; the vendored documents it fetches are never committed.
      SUITE_REFS: ${{ matrix.against == 'main' && 'EXCITER_REF=main ARMATURE_REF=main' || '' }}
    steps:
      # The build stamp reads tags, which a shallow checkout does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the Go module and build cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/go
          key: go-integration-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ hashFiles('backend/go.sum') }}-
            go-integration-

      - name: Hold the tool-stub and Rotor's reads to the siblings' main
        if: matrix.against == 'main'
        run: make tool-contracts-main test-contracts

      - name: Start Rotor's stack
        run: make stack-up

      # SUITE_REFS is split into its assignments, one argument each.
      - name: Start the suite's Exciter and Armature
        run: read -ra refs <<< "$SUITE_REFS"; make suite-up "${refs[@]}"

      - name: Run the tests against Exciter and Armature
        run: read -ra refs <<< "$SUITE_REFS"; make test-suite "${refs[@]}"

      - name: Say what the stacks logged
        if: failure()
        run: |
          docker compose logs --tail 200 api tool-stub keycloak
          make --no-print-directory suite-logs

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-reports-${{ matrix.against }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

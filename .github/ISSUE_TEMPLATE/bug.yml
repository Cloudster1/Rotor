name: Bug
description: Something does not work as it should
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: Remove tokens, secrets and personal data from anything you paste, logs and run events included.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: run
    attributes:
      label: Run ID
      description: The workflow run it happened in, if any.
  - type: dropdown
    id: sandbox
    attributes:
      label: Sandbox backend
      options:
        - Not about a run
        - Docker (development)
        - Kubernetes with gVisor
